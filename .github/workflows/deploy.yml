
name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Render secret
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi

          echo "Render deploy hook secret is configured."

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          response_code=$(curl \
            --silent \
            --show-error \
            --output /tmp/render-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL")

          if [ "$response_code" -lt 200 ] || [ "$response_code" -ge 300 ]; then
            echo "::error::Render returned HTTP $response_code."
            cat /tmp/render-response.txt
            exit 1
          fi

          echo "Render accepted the deployment request (HTTP $response_code)."
